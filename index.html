<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" /><link rel="icon" href="./icon.png.jpeg" />
  <link rel="apple-touch-icon" href="./icon.png.jpeg" />
  <meta name="apple-mobile-web-app-title" content="فحص مجمع البدور" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة الفحص اليومي بن رضا علوان فرع مجمع البدور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --espresso-dark: #3E2723;
      --espresso-deep: #261613;
      --cream-bg: #EFEBE9;
      --cream-soft: #F7F4F2;
      --caramel-accent: #8D6E63;
      --green-done: #1B5E20;
    }

    * {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--cream-bg);
      color: var(--espresso-dark);
      overflow-x: hidden;
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #EFEBE9;
    }
    ::-webkit-scrollbar-thumb {
      background: #8D6E63;
      border-radius: 9999px;
    }

    /* Smooth animations */
    .fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .toast-pop {
      animation: toastSlide 0.25s ease-out forwards;
    }
    @keyframes toastSlide {
      from {
        opacity: 0;
        transform: translate(-50%, 16px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }
  </style>
</head>
